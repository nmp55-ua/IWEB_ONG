# Servicios de desarrollo: PostgreSQL 16 y Mailpit (para ver los correos).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ong
      POSTGRES_USER: ong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ong_dev}
    ports:
      - "5432:5432"
    volumes:
      - datos_ong:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # bandeja web: http://localhost:8025

volumes:
  datos_ong:
